name: Deploy
on: {workflow_dispatch: {inputs: {environment: {type: choice, options: [staging, production], required: true}}}}
permissions: {id-token: write, contents: read}
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: us-east-1}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform init
      - run: terraform -chdir=infra/terraform apply -auto-approve -var environment=${{ inputs.environment }}
