groups:
  - name: creditflow
    rules:
      - alert: CreditFlowHighErrorRate
        expr: sum(rate(creditflow_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(creditflow_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels: {severity: page}
        annotations: {summary: "CreditFlow API 5xx rate exceeds 5%"}
      - alert: CreditFlowWorkflowFailures
        expr: increase(creditflow_workflow_failures_total[15m]) > 5
        labels: {severity: ticket}
        annotations: {summary: "Repeated underwriting workflow failures"}
      - alert: CreditFlowReviewBacklog
        expr: creditflow_cases_awaiting_review > 100
        for: 30m
        labels: {severity: ticket}
        annotations: {summary: "Human review backlog requires capacity review"}
