[project]
name = "creditflow-ai"
version = "0.1.0"
description = "Evidence-backed, human-supervised commercial credit underwriting"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite==0.21.0",
  "alembic==1.17.0",
  "asyncpg==0.30.0",
  "boto3==1.40.55",
  "fastapi==0.159.1",
  "httpx==0.28.1",
  "langgraph==1.2.16",
  "langgraph-checkpoint-postgres==3.2.0",
  "litellm-core==1.106.6",
  "mcp==2.3.0",
  "openai==2.20.0",
  "opentelemetry-api==1.44.0",
  "opentelemetry-exporter-otlp==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "prometheus-client==0.23.1",
  "pydantic==2.12.3",
  "pydantic-settings==2.14.1",
  "pyjwt[crypto]==2.15.1",
  "pymupdf==1.28.2",
  "python-multipart==0.0.32",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.44",
  "structlog==25.4.0",
  "starlette==1.3.1",
  "uvicorn[standard]==0.38.0",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
ai = ["sentence-transformers==5.1.1", "tiktoken==0.12.0"]
eval = ["ragas==0.3.7", "langsmith==0.14.12"]
dev = [
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "ruff==0.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creditflow"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/creditflow/retrieval/postgres_backend.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["creditflow"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "pymupdf", "sentence_transformers", "ragas", "ragas.*", "langsmith"]
ignore_missing_imports = true
disallow_untyped_calls = false
